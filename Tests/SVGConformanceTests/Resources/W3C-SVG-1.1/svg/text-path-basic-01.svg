<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="100" height="120"/>
    </clipPath>
  </defs>
  <!-- Filled text clipped to the left half -->
  <text x="10" y="40" font-family="Helvetica, sans-serif" font-size="24" fill="blue"
        clip-path="url(#leftHalf)">Clip</text>
  <!-- Stroked text, middle anchor -->
  <text x="100" y="90" font-family="Helvetica, sans-serif" font-size="20" fill="none"
        stroke="red" stroke-width="2" text-anchor="middle">Center</text>
</svg>
